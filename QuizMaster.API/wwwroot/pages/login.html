<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ავტორიზაცია - QuizMaster</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>QuizMaster ავტორიზაცია</h2>
            <p>შეიყვანეთ თქვენი მონაცემები სისტემაში შესასვლელად</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label>ელ-ფოსტა</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label>პაროლი</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div id="error-container" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem;"></div>
            <button type="submit" class="btn btn-full" id="submit-btn">შესვლა</button>
        </form>
    </div>

    <script type="module">
        import { auth } from '../js/auth.js';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('error-container');
            const btn = document.getElementById('submit-btn');

            errDiv.textContent = '';
            btn.disabled = true;
            btn.textContent = 'მიმდინარეობს შესვლა...';

            try {
                const user = await auth.login(email, password);
                const role = user.role ? user.role.toLowerCase() : 'student';
                
                if (role === 'lecturer' || role === 'admin') {
                    window.location.href = 'lecturer-dashboard.html';
                } else {
                    window.location.href = 'student-dashboard.html';
                }
            } catch (err) {
                errDiv.textContent = err.message || 'არასწორი ელ-ფოსტა ან პაროლი';
                btn.disabled = false;
                btn.textContent = 'შესვლა';
            }
        });
    </script>
</body>
</html>
